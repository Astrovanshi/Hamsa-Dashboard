[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hamsa-radar"
version = "0.1.0"
description = "End-of-day Indian equity research and opportunity screener"
requires-python = ">=3.11"
dependencies = [
    "duckdb==2.0.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]
